name: Build APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The beamforming maths lives in :core, a plain JVM module, specifically
      # so it can be checked here without a device or an emulator.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Wi-Fi Speed Test APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-speed-test-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Beamformer APK
        uses: actions/upload-artifact@v4
        with:
          name: beamformer-debug
          path: beamformer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
